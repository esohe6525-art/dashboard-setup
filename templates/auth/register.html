<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f7f9fc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
      form { background: white; padding: 24px; border-radius: 12px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
      input { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #d1d5db; border-radius: 8px; }
      button { background: #2563eb; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
      .message { padding: 10px; margin-bottom: 12px; border-radius: 8px; }
      .message.success { background: #dcfce7; color: #166534; }
      .message.error { background: #fee2e2; color: #991b1b; }
    </style>
  </head>
  <body>
    <form method="post">
      <h2>Create Account</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <label>Username</label>
      <input type="text" name="username" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Register</button>
    </form>
  </body>
</html>
