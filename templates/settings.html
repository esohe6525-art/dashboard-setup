<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Settings</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f7f9fc; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
      form { background: white; padding: 32px; border-radius: 14px; width: 400px; box-shadow: 0 14px 40px rgba(0,0,0,0.08); }
      input { width: 100%; padding: 10px; margin: 10px 0 18px; border: 1px solid #d1d5db; border-radius: 10px; }
      button { background: #2563eb; color: white; border: none; padding: 12px 16px; border-radius: 10px; cursor: pointer; width: 100%; }
      .message { padding: 12px; margin-bottom: 16px; border-radius: 10px; }
      .message.success { background: #dcfce7; color: #166534; }
      .message.error { background: #fee2e2; color: #991b1b; }
      .actions { margin-top: 20px; }
      a { color: #2563eb; text-decoration: none; margin-right: 12px; }
    </style>
  </head>
  <body>
    <form method="post">
      <h2>Account Settings</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <label>Current password</label>
      <input type="password" name="current_password" required>
      <label>New password</label>
      <input type="password" name="new_password" required>
      <label>Confirm new password</label>
      <input type="password" name="confirm_password" required>
      <button type="submit">Update password</button>
      <div class="actions">
        <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('main.profile') }}">Profile</a>
      </div>
    </form>
  </body>
</html>
