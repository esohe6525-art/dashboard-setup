<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f7f9fc; margin: 0; }
      .container { max-width: 760px; margin: 60px auto; padding: 32px; background: white; border-radius: 14px; box-shadow: 0 12px 36px rgba(0,0,0,0.08); }
      h1 { margin-top: 0; }
      .detail { margin-bottom: 16px; }
      .detail strong { display: block; margin-bottom: 4px; }
      a { color: #2563eb; text-decoration: none; margin-right: 16px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Profile</h1>
      <div class="detail">
        <strong>Username</strong>
        <span>{{ user.username }}</span>
      </div>
      <div class="detail">
        <strong>Member since</strong>
        <span>{{ user.created_at.strftime('%B %d, %Y') if user.created_at else 'N/A' }}</span>
      </div>
      <div class="actions">
        <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('main.settings') }}">Account Settings</a>
        <a href="{{ url_for('auth.logout') }}">Logout</a>
      </div>
    </div>
  </body>
</html>
